<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ARIS — RPF Command &amp; Control</title>
<style>
  :root{
    --navy: #16244a;
    --navy-deep: #0f1a37;
    --blue: #2b4fd6;
    --blue-soft: #e8edfb;
    --bg: #eef1f8;
    --card: #ffffff;
    --border: #e2e6f0;
    --text: #16244a;
    --text-dim: #6b7690;
    --text-faint: #97a0b8;
    --green: #14b872;
    --green-bg: #e6f8ef;
    --amber: #e8912b;
    --amber-bg: #fdf1e2;
    --red: #e0435a;
    --red-bg: #fdeaed;
    --radius: 12px;
    --shadow: 0 1px 2px rgba(22,36,74,.04), 0 8px 24px rgba(22,36,74,.06);
  }
  body.dark-mode{
    --navy: #e9edfb;
    --navy-deep: #ffffff;
    --blue: #6f90ff;
    --blue-soft: #1c2747;
    --bg: #0e1220;
    --card: #161c2e;
    --border: #29314a;
    --text: #e9edfb;
    --text-dim: #a2acc9;
    --text-faint: #707aa0;
    --green: #2bdb96;
    --green-bg: #103224;
    --amber: #f2ac4c;
    --amber-bg: #392c15;
    --red: #ff6478;
    --red-bg: #3a1a22;
  }
  body{transition: background-color .15s ease;}
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    -webkit-font-smoothing: antialiased;
  }
  button{font-family:inherit;}
  a{color:inherit;}

  #login-screen{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    background:
      radial-gradient(1100px 700px at 8% 18%, #dbe4fb 0%, transparent 55%),
      radial-gradient(900px 600px at 92% 85%, #dbe4fb 0%, transparent 55%),
      var(--bg);
    padding: 24px;
  }
  .login-wrap{
    width:100%;
    max-width:1080px;
    display:grid;
    grid-template-columns: 1fr 420px;
    gap:64px;
    align-items:center;
  }
  .brand-mark{
    width:52px;height:52px;border-radius:14px;
    background: var(--navy);
    display:flex;align-items:center;justify-content:center;
    box-shadow: var(--shadow);
    margin-bottom:22px;
  }
  .login-copy h1{
    font-size:40px; letter-spacing:1px; margin:0 0 6px; font-weight:800; color:var(--navy);
  }
  .login-copy .sub{
    font-size:13px; letter-spacing:2px; font-weight:700; color:var(--text-dim); text-transform:uppercase; margin-bottom:26px;
  }
  .login-copy p.tagline{ font-size:18px; color:#3c4869; max-width:340px; line-height:1.5; margin:0 0 22px;}
  .status-pill{
    display:inline-flex; align-items:center; gap:8px; font-weight:700; font-size:13px; color:var(--green);
  }
  .status-pill .dot{width:8px;height:8px;border-radius:50%;background:var(--green);}

  .login-card{
    background: var(--card);
    border-radius: 20px;
    box-shadow: var(--shadow);
    padding: 34px;
    border: 1px solid var(--border);
  }
  .login-badge{
    display:flex; align-items:center; gap:10px; margin-bottom:22px;
  }
  .login-badge .icon{
    width:34px;height:34px;border-radius:9px;background:var(--navy);
    display:flex;align-items:center;justify-content:center;
  }
  .login-badge span{font-size:11px; font-weight:800; letter-spacing:1.5px; color:var(--text-dim);}
  .login-card h2{margin:0 0 6px; font-size:24px; color:var(--navy);}
  .login-card p.hint{margin:0 0 22px; font-size:13.5px; color:var(--text-dim);}
  .field{margin-bottom:16px;}
  .field label{display:block; font-size:13px; font-weight:700; margin-bottom:6px; color:var(--navy);}
  .field input{
    width:100%; padding:11px 12px; border-radius:9px; border:1px solid var(--border);
    font-size:14px; color:var(--text); background:#fbfcfe;
  }
  .field input:focus{outline:2px solid var(--blue); outline-offset:1px;}
  .row-between{display:flex; align-items:center; justify-content:space-between; margin-bottom:20px; font-size:13px;}
  .remember{display:flex; align-items:center; gap:7px; color:var(--text-dim);}
  .forgot{color:var(--blue); font-weight:600; text-decoration:none;}
  .btn-primary{
    width:100%; padding:13px; border:none; border-radius:10px; background:var(--navy); color:#fff;
    font-weight:700; font-size:14.5px; cursor:pointer; display:flex; align-items:center; justify-content:center; gap:8px;
    transition: background .15s;
  }
  .btn-primary:hover{background:var(--navy-deep);}
  .login-foot{margin-top:16px; text-align:center; font-size:12px; color:var(--text-faint); display:flex; align-items:center; justify-content:center; gap:6px;}

  #app{display:none; min-height:100vh;}
  .shell{display:grid; grid-template-columns:240px 1fr; min-height:100vh;}
  .sidebar{
    background:#fff; border-right:1px solid var(--border);
    display:flex; flex-direction:column; padding:22px 16px;
    position:sticky; top:0; height:100vh;
  }
  .sb-brand{display:flex; align-items:center; gap:10px; padding:0 6px 20px;}
  .sb-brand .icon{width:34px;height:34px;border-radius:9px;background:var(--navy);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .sb-brand .name{font-weight:800; font-size:17px; letter-spacing:1px; color:var(--navy); line-height:1.1;}
  .sb-brand .sub{font-size:10px; font-weight:700; letter-spacing:1px; color:var(--text-faint);}
  .sb-status{
    display:flex; align-items:center; gap:8px; background:var(--green-bg); color:var(--green);
    font-size:12.5px; font-weight:700; padding:9px 12px; border-radius:9px; margin-bottom:18px;
  }
  .sb-status .dot{width:7px;height:7px;border-radius:50%;background:var(--green);}
  .nav-group{flex:1;}
  .nav-item{
    display:flex; align-items:center; gap:11px; padding:10px 12px; border-radius:9px; margin-bottom:2px;
    color:var(--text-dim); font-size:14px; font-weight:600; cursor:pointer; border:none; background:none; width:100%; text-align:left;
    position:relative;
  }
  .nav-item svg{width:18px;height:18px; flex-shrink:0;}
  .nav-item:hover{background:#f3f5fb; color:var(--navy);}
  .nav-item.active{background:var(--blue-soft); color:var(--blue);}
  .nav-item .badge{
    margin-left:auto; background:var(--red); color:#fff; font-size:11px; font-weight:800;
    border-radius:999px; padding:1px 7px;
  }
  .sb-bottom{border-top:1px solid var(--border); padding-top:12px;}
  .sb-user{display:flex; align-items:center; gap:10px; padding:8px 6px; margin-top:6px;}
  .avatar{width:34px;height:34px;border-radius:50%; background:var(--blue); color:#fff; display:flex; align-items:center; justify-content:center; font-weight:700; font-size:13px; flex-shrink:0;}
  .sb-user .u-name{font-size:13.5px; font-weight:700; color:var(--navy);}
  .sb-user .u-role{font-size:11.5px; color:var(--text-faint);}

  .main{display:flex; flex-direction:column; min-width:0;}
  .topbar{
    display:flex; align-items:center; justify-content:space-between;
    padding:20px 30px; background:var(--bg);
  }
  .crumb{font-size:12.5px; color:var(--text-faint); font-weight:600; margin-bottom:2px;}
  .crumb b{color:var(--text-dim);}
  .page-title{font-size:24px; font-weight:800; color:var(--navy);}
  .top-right{display:flex; align-items:center; gap:16px;}
  .searchbox{
    display:flex; align-items:center; gap:8px; background:#fff; border:1px solid var(--border);
    border-radius:9px; padding:9px 14px; width:260px; color:var(--text-faint); font-size:13px;
  }
  .searchbox svg{width:15px;height:15px; flex-shrink:0;}
  .bell{position:relative; width:36px;height:36px; border-radius:9px; background:#fff; border:1px solid var(--border); display:flex; align-items:center; justify-content:center;}
  .bell .dot{position:absolute; top:8px; right:9px; width:7px;height:7px;border-radius:50%;background:var(--red);}
  .top-avatar{width:36px;height:36px;border-radius:50%; background:var(--blue); color:#fff; display:flex; align-items:center; justify-content:center; font-weight:700; font-size:13px; cursor:pointer;}

  .content{padding:0 30px 36px; flex:1;}
  .view{display:none;}
  .view.active{display:block;}

  .loc-row{display:flex; align-items:center; justify-content:space-between; margin-bottom:18px;}
  .loc-row .loc{font-size:13.5px; color:var(--text-dim);}
  .station-select{background:#fff; border:1px solid var(--border); border-radius:9px; padding:9px 14px; font-size:13px; font-weight:600; color:var(--navy); display:flex; align-items:center; gap:8px; cursor:pointer;}

  .stat-grid{display:grid; grid-template-columns:repeat(5, 1fr); gap:16px; margin-bottom:20px;}
  .stat-card{background:var(--card); border:1px solid var(--border); border-radius:var(--radius); padding:18px 18px; box-shadow:var(--shadow);}
  .stat-top{display:flex; align-items:center; justify-content:space-between; margin-bottom:14px;}
  .stat-label{font-size:12.5px; color:var(--text-dim); font-weight:600;}
  .stat-icon{width:26px;height:26px; border-radius:7px; display:flex; align-items:center; justify-content:center;}
  .stat-icon svg{width:14px;height:14px;}
  .stat-icon.red{background:var(--red-bg); color:var(--red);}
  .stat-icon.green{background:var(--green-bg); color:var(--green);}
  .stat-icon.amber{background:var(--amber-bg); color:var(--amber);}
  .stat-icon.blue{background:var(--blue-soft); color:var(--blue);}
  .stat-value{font-size:30px; font-weight:800; color:var(--navy); margin-bottom:4px;}
  .stat-foot{font-size:11.5px; color:var(--text-faint);}
  .stat-foot.up{color:var(--green); font-weight:700;}

  .grid-main{display:grid; grid-template-columns:1fr 340px; gap:18px; align-items:start;}
  .card{background:var(--card); border:1px solid var(--border); border-radius:var(--radius); box-shadow:var(--shadow); overflow:hidden;}
  .card-pad{padding:18px 20px;}
  .card-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:2px;}
  .card-eyebrow{display:flex; align-items:center; gap:7px; font-size:12.5px; font-weight:700; color:var(--text-dim);}
  .card-eyebrow .dot{width:7px;height:7px;border-radius:50%;background:var(--green);}
  .card-title{font-size:17px; font-weight:700; color:var(--navy); margin-top:4px;}
  .link-btn{font-size:12.5px; font-weight:700; color:var(--blue); background:#f4f6fc; border:1px solid var(--border); padding:7px 12px; border-radius:8px; cursor:pointer; display:flex; align-items:center; gap:4px;}

  .map-wrap{position:relative; height:400px; background:
    linear-gradient(#eef1f8 1px, transparent 1px) 0 0/28px 28px,
    linear-gradient(90deg, #eef1f8 1px, transparent 1px) 0 0/28px 28px,
    #f6f8fc;
    margin-top:12px;
  }
  .map-wrap > svg{position:absolute; inset:0; width:100%; height:100%;}
  .map-zoom{position:absolute; top:12px; right:12px; display:flex; flex-direction:column; background:#fff; border-radius:8px; box-shadow:var(--shadow); overflow:hidden;}
  .map-label{position:absolute; font-size:12px; font-weight:600; color:var(--text-faint);}
  .robot-pin{position:absolute; width:34px;height:34px; border-radius:50%; background:var(--blue); border:3px solid #fff; box-shadow:0 3px 8px rgba(43,79,214,.4); display:flex; align-items:center; justify-content:center; color:#fff; transform:translate(-50%,-50%);}
  .threat-pin{position:absolute; width:34px;height:34px; border-radius:50% 50% 50% 0; background:var(--red); border:3px solid #fff; box-shadow:0 3px 8px rgba(224,67,90,.4); display:flex; align-items:center; justify-content:center; color:#fff; transform:translate(-50%,-100%) rotate(45deg);}
  .threat-pin svg{transform:rotate(-45deg); width:14px;height:14px;}
  .map-legend{display:flex; align-items:center; gap:18px; padding:12px 20px; font-size:12px; color:var(--text-dim); border-top:1px solid var(--border);}
  .map-legend .item{display:flex; align-items:center; gap:6px;}
  .map-legend .sw{width:9px;height:9px;border-radius:50%;}
  .map-legend .sw.line{width:16px;height:2px;border-radius:0;}
  .map-legend .updated{margin-left:auto; color:var(--text-faint);}
  .map-alert{
    position:absolute; left:16px; right:16px; bottom:16px; background:var(--red); color:#fff;
    border-radius:10px; padding:12px 16px; display:flex; align-items:center; gap:12px; box-shadow:0 8px 20px rgba(224,67,90,.35);
    cursor:pointer;
  }
  .map-alert .ic{width:30px;height:30px; border-radius:50%; background:rgba(255,255,255,.18); display:flex; align-items:center; justify-content:center; flex-shrink:0;}
  .map-alert .txt b{display:block; font-size:13.5px;}
  .map-alert .txt span{font-size:11.5px; opacity:.85;}
  .map-alert .chev{margin-left:auto; opacity:.85;}

  .cam-card{margin-bottom:18px;}
  .cam-head{display:flex; align-items:center; justify-content:space-between; padding:16px 18px 0;}
  .cam-title{display:flex; align-items:center; gap:8px; font-size:13.5px; font-weight:700; color:var(--navy);}
  .live-tag{display:flex; align-items:center; gap:5px; font-size:11.5px; font-weight:700; color:var(--green);}
  .live-tag .dot{width:6px;height:6px;border-radius:50%;background:var(--green);}
  .cam-feed{margin:12px 18px 6px; height:120px; border-radius:9px; position:relative; overflow:hidden;
    background:repeating-linear-gradient(90deg,#d7dcea 0 1px, #e7ebf4 1px 26px), repeating-linear-gradient(0deg,#d7dcea 0 1px, #e7ebf4 1px 26px);}
  .cam-feed.thermal{background:linear-gradient(135deg,#3a3550,#ab6a33,#d9a441);}
  .cam-box{position:absolute; border:2px solid var(--red); border-radius:3px;}
  .cam-box .tag{position:absolute; top:-18px; left:-2px; background:var(--red); color:#fff; font-size:10px; font-weight:800; padding:1px 5px; border-radius:3px;}
  .cam-foot{display:flex; align-items:center; justify-content:space-between; padding:0 18px 16px; font-size:12px; color:var(--text-faint);}

  .robot-status-card{padding:18px;}
  .rs-head{display:flex; align-items:center; justify-content:space-between;}
  .rs-eyebrow{font-size:11.5px; font-weight:800; letter-spacing:.5px; color:var(--text-faint);}
  .rs-online{display:flex; align-items:center; gap:5px; font-size:11.5px; font-weight:700; color:var(--green);}
  .rs-online .dot{width:6px;height:6px;border-radius:50%;background:var(--green);}
  .rs-name{font-size:19px; font-weight:800; color:var(--navy); margin:2px 0 14px;}
  .rs-mode{display:flex; align-items:center; gap:12px; background:var(--blue-soft); border-radius:10px; padding:12px 14px; margin-bottom:16px;}
  .rs-mode .ic{width:36px;height:36px;border-radius:9px; background:var(--blue); color:#fff; display:flex; align-items:center; justify-content:center; flex-shrink:0;}
  .rs-mode b{display:block; font-size:13.5px; color:var(--navy);}
  .rs-mode span{font-size:11.5px; color:var(--text-dim);}
  .rs-metrics{display:flex; justify-content:space-between; margin-bottom:14px;}
  .rs-metric .lbl{display:flex; align-items:center; gap:5px; font-size:11.5px; color:var(--text-faint); margin-bottom:4px;}
  .rs-metric .val{font-size:15px; font-weight:800; color:var(--navy);}
  .bar-track{height:6px; background:var(--border); border-radius:99px; margin-top:6px; overflow:hidden;}
  .bar-fill{height:100%; background:var(--blue); border-radius:99px;}
  .signal-bars{display:flex; align-items:flex-end; gap:2px; margin-top:6px; height:12px;}
  .signal-bars span{width:4px; background:var(--green); border-radius:1px;}
  .rs-progress-lbl{display:flex; justify-content:space-between; font-size:11.5px; color:var(--text-faint); margin-bottom:6px;}
  .btn-block{width:100%; padding:12px; border:none; border-radius:10px; background:var(--blue); color:#fff; font-weight:700; font-size:13.5px; cursor:pointer; display:flex; align-items:center; justify-content:center; gap:6px; margin-top:14px;}
  .btn-block:hover{background:#1f3fb8;}

  .attn-card{margin-top:18px;}
  .attn-head{display:flex; align-items:center; justify-content:space-between; padding:18px 20px 6px;}
  .attn-eyebrow{font-size:11.5px; font-weight:800; letter-spacing:.5px; color:var(--red);}
  .attn-title{display:flex; align-items:center; gap:8px; font-size:17px; font-weight:700; color:var(--navy); margin-top:4px;}
  .count-pill{background:var(--red); color:#fff; font-size:11px; font-weight:800; border-radius:99px; padding:1px 8px;}
  .viewall{font-size:12.5px; font-weight:700; color:var(--blue); background:none; border:none; cursor:pointer; display:flex; align-items:center; gap:3px;}
  .alert-row{display:flex; align-items:center; gap:14px; padding:13px 20px; border-top:1px solid var(--border); cursor:pointer;}
  .alert-row:hover{background:#fafbfe;}
  .alert-ic{width:34px;height:34px; border-radius:9px; display:flex; align-items:center; justify-content:center; flex-shrink:0;}
  .alert-ic.red{background:var(--red-bg); color:var(--red);}
  .alert-ic.amber{background:var(--amber-bg); color:var(--amber);}
  .alert-body b{display:block; font-size:13.5px; color:var(--navy);}
  .alert-body span{font-size:11.5px; color:var(--text-faint);}
  .alert-conf{margin-left:auto; text-align:right; font-size:13px; font-weight:800; color:var(--red); display:flex; align-items:center; gap:8px;}
  .alert-conf small{font-weight:600; color:var(--text-faint); font-size:11px;}

  .rc-grid{display:grid; grid-template-columns:1fr 340px; gap:18px; align-items:start;}
  .rc-mode-toggle{display:flex; gap:0; background:#f1f3f9; border-radius:9px; padding:3px;}
  .rc-mode-toggle button{border:none; background:none; padding:8px 16px; font-size:12.5px; font-weight:700; color:var(--text-dim); border-radius:7px; cursor:pointer;}
  .rc-mode-toggle button.active{background:var(--blue); color:#fff;}
  #view-settings .rc-mode-toggle button{display:inline-flex; align-items:center; gap:6px;}
  #view-settings .card{margin-bottom:16px;}
  .settings-row{display:flex; align-items:center; justify-content:space-between; gap:16px; padding:13px 0; border-top:1px solid var(--border);}
  .settings-row:first-of-type{border-top:none; padding-top:2px;}
  .settings-row .st-label b{display:block; font-size:13.5px; font-weight:700; color:var(--navy);}
  .settings-row .st-label span{display:block; font-size:12px; color:var(--text-faint); margin-top:2px;}
  .switch{position:relative; display:inline-block; width:40px; height:23px; flex-shrink:0;}
  .switch input{opacity:0; width:0; height:0;}
  .switch .slider{position:absolute; cursor:pointer; inset:0; background:var(--border); border-radius:999px; transition:.15s;}
  .switch .slider::before{content:""; position:absolute; width:17px; height:17px; left:3px; top:3px; background:#fff; border-radius:50%; transition:.15s;}
  .switch input:checked + .slider{background:var(--blue);}
  .switch input:checked + .slider::before{transform:translateX(17px);}

  body.dark-mode .sidebar{background:var(--card);}
  body.dark-mode .searchbox{background:var(--card);}
  body.dark-mode .bell{background:var(--card);}
  body.dark-mode .station-select{background:var(--card);}
  body.dark-mode .map-zoom{background:var(--card);}
  body.dark-mode .brand-mark{background:#26335e;}
  body.dark-mode .login-badge .icon{background:#26335e;}
  body.dark-mode .sb-brand .icon{background:#26335e;}
  body.dark-mode .export-btn{background:#26335e;}
  body.dark-mode .btn-primary{background:#26335e;}
  body.dark-mode .btn-primary:hover{background:#32407a;}
  body.dark-mode .login-copy p.tagline{color:var(--text-dim);}
  body.dark-mode .nav-item:hover{background:var(--blue-soft);}
  body.dark-mode .link-btn{background:var(--blue-soft);}
  body.dark-mode .dpad button{background:var(--card);}
  body.dark-mode .cam-btn{background:var(--card);}
  body.dark-mode .telemetry-box{background:var(--card);}
  body.dark-mode .rc-mode-toggle{background:var(--bg);}
  body.dark-mode tbody tr:hover{background:var(--blue-soft);}
  body.dark-mode .alert-row:hover{background:var(--blue-soft);}
  body.dark-mode #login-screen{background: radial-gradient(1100px 700px at 8% 18%, #1c2747 0%, transparent 55%), radial-gradient(900px 600px at 92% 85%, #1c2747 0%, transparent 55%), var(--bg);}
  body.dark-mode .cam-feed{background:repeating-linear-gradient(90deg,var(--border) 0 1px, var(--card) 1px 26px), repeating-linear-gradient(0deg,var(--border) 0 1px, var(--card) 1px 26px);}
  body.dark-mode .map-wrap{background:
    linear-gradient(var(--border) 1px, transparent 1px) 0 0/28px 28px,
    linear-gradient(90deg, var(--border) 1px, transparent 1px) 0 0/28px 28px,
    var(--card);
  }
  .rc-buttons{display:grid; grid-template-columns:1fr 1fr; gap:12px; margin:18px 0 12px;}
  .rc-btn{padding:14px; border:none; border-radius:10px; font-weight:700; font-size:14px; cursor:pointer; display:flex; align-items:center; justify-content:center; gap:8px;}
  .rc-btn.start{background:var(--green); color:#fff;}
  .rc-btn.stop{background:var(--red); color:#fff;}

  .cam-btn small{font-weight:600; color:var(--text-faint); font-size:10.5px;}

  .sensor-grid{display:grid; grid-template-columns:1fr 320px; gap:18px; align-items:start;}
  .tabs{display:flex; gap:22px; border-bottom:1px solid var(--border); padding:0 20px; margin-top:6px;}
  .tab{padding:12px 0; font-size:13.5px; font-weight:700; color:var(--text-faint); cursor:pointer; border-bottom:2px solid transparent;}
  .tab.active{color:var(--blue); border-color:var(--blue);}
  .telemetry-box{margin:18px 20px 20px; background:#f7f9fd; border-radius:10px; padding:18px;}
  .telemetry-box .lbl{display:flex; align-items:center; gap:6px; font-size:12.5px; font-weight:700; color:var(--text-dim); margin-bottom:6px;}
  .telemetry-box .val{font-size:30px; font-weight:800; color:var(--navy);}

  #tel-chart{width:100%; height:100px; display:block;}
  .health-row{display:flex; align-items:center; justify-content:space-between; padding:13px 20px; border-top:1px solid var(--border); font-size:13.5px;}
  .health-row .name{display:flex; align-items:center; gap:8px; color:var(--navy); font-weight:600;}
  .health-row .name .dot{width:7px;height:7px;border-radius:50%;background:var(--green);}
  .health-row .stat{font-weight:700; color:var(--green); font-size:12.5px;}

  table{width:100%; border-collapse:collapse;}
  thead th{text-align:left; font-size:11px; font-weight:800; letter-spacing:.4px; color:var(--text-faint); padding:16px 20px 12px; text-transform:uppercase;}
  tbody td{padding:14px 20px; border-top:1px solid var(--border); font-size:13.5px; color:var(--navy);}
  tbody tr:hover{background:#fafbfe;}
  .ev-name{display:flex; align-items:center; gap:9px; font-weight:700;}
  .ev-name .dot{width:7px;height:7px;border-radius:50%; flex-shrink:0;}
  .ev-name .dot.red{background:var(--red);} .ev-name .dot.amber{background:var(--amber);} .ev-name .dot.blue{background:var(--blue);}
  .pill-status{display:inline-flex; align-items:center; gap:5px; background:var(--green-bg); color:var(--green); font-size:11.5px; font-weight:700; padding:4px 10px; border-radius:99px;}
  .pill-status .dot{width:6px;height:6px;border-radius:50%;background:var(--green);}
  .export-btn{display:flex; align-items:center; gap:6px; background:var(--navy); color:#fff; border:none; padding:9px 14px; border-radius:8px; font-size:12.5px; font-weight:700; cursor:pointer;}

  .empty-note{padding:60px 20px; text-align:center; color:var(--text-faint); font-size:13.5px;}

  @media (max-width: 1100px){
    .grid-main, .rc-grid, .sensor-grid{grid-template-columns:1fr;}
    .stat-grid{grid-template-columns:repeat(2,1fr);}
  }
  @media (max-width: 760px){
    .shell{grid-template-columns:1fr;}
    .sidebar{display:none;}
    .login-wrap{grid-template-columns:1fr;}
    .stat-grid{grid-template-columns:1fr;}
    .topbar{flex-direction:column; align-items:flex-start; gap:14px;}
    .searchbox{width:100%;}
  }
</style>

function greetingWord(){
  const istHour = parseInt(new Date().toLocaleString('en-US', {timeZone:'Asia/Kolkata', hour:'2-digit', hour12:false}), 10);
  if(istHour < 5) return 'Good night';
  if(istHour < 12) return 'Good morning';
  if(istHour < 17) return 'Good afternoon';
  if(istHour < 21) return 'Good evening';
  return 'Good night';
}

let currentUserFirstName = 'Arjun';
let currentUserFullName = 'Arjun Singh';
let currentUserInitials = 'AS';

function applyLoggedInUser(loginId){
  const namePart = (loginId.split('@')[0] || loginId).trim();
  const words = namePart.replace(/[._-]+/g, ' ').split(' ').filter(Boolean);
  const displayName = words.length
    ? words.map(w => w.charAt(0).toUpperCase() + w.slice(1)).join(' ')
    : loginId;
  const initials = words.length >= 2
    ? (words[0][0] + words[1][0]).toUpperCase()
    : displayName.slice(0, 2).toUpperCase();

  currentUserFirstName = words.length ? (words[0].charAt(0).toUpperCase() + words[0].slice(1)) : displayName;
  currentUserFullName = displayName;
  currentUserInitials = initials;

  document.getElementById('sb-uname').textContent = currentUserFullName;
  document.getElementById('sb-avatar').textContent = currentUserInitials;
  document.getElementById('top-avatar').textContent = currentUserInitials;
  const pageTitleEl = document.getElementById('page-title');
  if (pageTitleEl && document.getElementById('crumb-page').textContent === 'Overview') {
    pageTitleEl.textContent = greetingWord() + ', ' + currentUserFirstName;
  }
}

document.getElementById('login-form').addEventListener('submit', function(e){
  e.preventDefault();
  const loginId = document.getElementById('login-email').value;
  applyLoggedInUser(loginId);
  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('app').style.display = 'block';
  initApp();
});

let tempUnit = 'C';
function formatTemp(celsius){
  return tempUnit === 'C' ? celsius.toFixed(1) + '\u00b0C' : (celsius * 9/5 + 32).toFixed(1) + '\u00b0F';
}
function applyTempUnit(){
  TEL.thermal.val = formatTemp(27.4);
  document.getElementById('cam-therm-1').textContent = formatTemp(36.5);
  document.getElementById('cam-therm-2').textContent = formatTemp(36.5);
  const activeTabEl = document.querySelector('.tab[data-tab].active');
  if(activeTabEl && activeTabEl.dataset.tab === 'thermal'){
    document.getElementById('tel-val').textContent = TEL.thermal.val;
  }
}
const unitCelsius = document.getElementById('unit-celsius');
const unitFahrenheit = document.getElementById('unit-fahrenheit');
unitCelsius && unitCelsius.addEventListener('click', ()=>{
  tempUnit = 'C';
  unitCelsius.classList.add('active'); unitFahrenheit.classList.remove('active');
  applyTempUnit();
});
unitFahrenheit && unitFahrenheit.addEventListener('click', ()=>{

function nowStr(){
  return new Date().toLocaleTimeString('en-IN', {hour:'2-digit', minute:'2-digit', second:'2-digit', hour12:true});
}

let chartData = [];
function seedChart(){
  chartData = Array.from({length:40}, function(){ return 0.02 + (Math.random()-0.5)*0.015; });
}
function drawChart(){
  const svg = document.getElementById('tel-chart');
  if(!svg) return;
  const w=600,h=100, min=Math.min.apply(null,chartData), max=Math.max.apply(null,chartData);
  const pts = chartData.map(function(v,i){
    const x = i/(chartData.length-1)*w;
    const y = h - ((v-min)/((max-min)||1))*(h-14) - 7;
    return x.toFixed(1)+','+y.toFixed(1);
  }).join(' ');
  svg.innerHTML = '<polyline points="'+pts+'" fill="none" stroke="#2b4fd6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>';
}

function initApp(){
  renderEvents('all');
  seedChart();
  drawChart();
  const tt = document.getElementById('tel-time');
  if(tt) tt.textContent = nowStr();

  setInterval(function(){
    if(!autoRefreshOn) return;
    const clockEl = document.getElementById('clock');
    if(clockEl) clockEl.textContent = 'just now';
    chartData.shift();
    chartData.push(0.02 + (Math.random()-0.5)*0.015);
    drawChart();
    const activeTabEl = document.querySelector('.tab[data-tab].active');
    const activeTab = activeTabEl ? activeTabEl.dataset.tab : 'ims';
    if(activeTab==='ims'){
      const v = document.getElementById('tel-val');
      if(v) v.textContent = chartData[chartData.length-1].toFixed(2) + ' ppm';
    }
    const tt2 = document.getElementById('tel-time');
    if(tt2) tt2.textContent = nowStr();
  }, 2200);

  let batt = 78, prog = 64;
  setInterval(function(){
    if(!autoRefreshOn) return;
    batt = Math.max(20, batt - 0.2);
    prog = prog >= 100 ? 0 : prog + 0.6;
    ['ov','rc'].forEach(function(p){
      const b = document.getElementById(p+'-batt'); if(b) b.textContent = Math.round(batt)+'%';
      const bb = document.getElementById(p+'-batt-bar'); if(bb) bb.style.width = batt+'%';
      const pv = document.getElementById(p+'-progress-val'); if(pv) pv.textContent = Math.round(prog)+'%';
      const pb = document.getElementById(p+'-progress-bar'); if(pb) pb.style.width = prog+'%';
    });
  }, 4000);
}
</script>
